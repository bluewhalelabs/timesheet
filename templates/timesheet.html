<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}} {{reference}}</title>
<style>
@page { size: Letter; margin: 0.75in; }
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body {
  margin: 0;
  color: #1a1a1a;
  background: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 10.5pt;
  line-height: 1.45;
}
.page { max-width: 7in; margin: 0 auto; }
h1, h2, h3, p { margin: 0; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5in;
  padding-bottom: 14pt; border-bottom: 1.5pt solid #4a5560; }
.from img.logo { display: block; max-height: 0.7in; max-width: 2.4in; margin-bottom: 8pt; }
.from .biz { font-size: 15pt; font-weight: 600; letter-spacing: 0.01em; }
.from .biz:empty { display: none; }
.from .meta { color: #55606b; font-size: 9.5pt; }
.doc { text-align: right; }
.doc .title { font-size: 20pt; font-weight: 300; letter-spacing: 0.08em; text-transform: uppercase;
  color: #4a5560; }
.doc .ref, .doc .period { color: #55606b; font-size: 9.5pt; }
.to { margin: 18pt 0 20pt; }
.to h3 { font-size: 8.5pt; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: #4a5560; margin-bottom: 3pt; }
.to .name { font-weight: 600; }
.to .meta { color: #55606b; font-size: 9.5pt; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 8.5pt; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: #4a5560; padding: 5pt 8pt; border-bottom: 1pt solid #4a5560; }
td { padding: 6pt 8pt; vertical-align: top; border-bottom: 0.5pt solid #d5d9dd; }
thead { display: table-header-group; }
tr { break-inside: avoid; page-break-inside: avoid; }
th.num, td.num { text-align: right; white-space: nowrap; }
td.date { white-space: nowrap; width: 1.45in; }
td.desc { white-space: pre-line; overflow-wrap: anywhere; }
tr.total { break-inside: avoid; page-break-inside: avoid; break-before: avoid;
  page-break-before: avoid; }
tr.total td { border-top: 1.5pt solid #4a5560; border-bottom: none; font-weight: 600;
  padding-top: 8pt; }
tr.total td.label { text-align: right; letter-spacing: 0.08em; text-transform: uppercase;
  font-size: 9pt; color: #4a5560; }
.subtotals { margin-top: 22pt; width: 55%; break-inside: avoid; }
.subtotals h3, .detail h2 { font-size: 8.5pt; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: #4a5560; margin-bottom: 4pt; }
.subtotals table { font-size: 9.5pt; }
.subtotals .subnote { color: #55606b; font-size: 9pt; margin-bottom: 4pt; }
.foot { margin-top: 24pt; color: #55606b; font-size: 9.5pt; white-space: pre-line; }
.foot:empty { display: none; }
.detail { break-before: page; page-break-before: always; }
.detail table { font-size: 9.5pt; }
.detail td.when { white-space: nowrap; }
.detail .note { margin-top: 16pt; color: #55606b; font-size: 9.5pt; }
</style>
</head>
<body>
<div class="page">
<header class="top">
  <div class="from">{{logo}}<h1 class="biz">{{business}}</h1>{{you_block}}</div>
  <div class="doc">
    <h2 class="title">{{title}}</h2>
    <p class="ref">Reference {{reference}}</p>
    <p class="period">{{period_label}}</p>
  </div>
</header>
<section class="to">
  <h3>Prepared for</h3>
  {{client_block}}
</section>
<table class="items">
  <thead>
    <tr><th>{{item_header}}</th><th>Description</th><th class="num">Hours</th><th class="num">Rate</th><th class="num">Amount</th></tr>
  </thead>
  <tbody>
{{rows}}
    <tr class="total"><td class="label" colspan="2">Total</td><td class="num">{{total_hours}}</td><td></td><td class="num">{{total}}</td></tr>
  </tbody>
</table>
{{subtotals}}
{{footer}}
{{detail_page}}
</div>
</body>
</html>
